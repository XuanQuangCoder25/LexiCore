services:
  backend:
    container_name: lexicore_backend
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - lexicore_backend_modules:/app/node_modules
    env_file:
      - ./backend/.env

  frontend:
    container_name: lexicore_frontend
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - lexicore_frontend_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

# Khai báo named volumes để Docker quản lý riêng
volumes:
  lexicore_backend_modules:
  lexicore_frontend_modules: