version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    env_file:
      - ./backend/.env

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

# Khai báo named volumes để Docker quản lý riêng
volumes:
  backend_modules:
  frontend_modules: