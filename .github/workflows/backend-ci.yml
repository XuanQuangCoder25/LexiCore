name: Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
    # Chỉ kích hoạt Pipeline này nếu có file nào đó trong thư mục backend thay đổi
    paths:
      - 'backend/**' 

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # RẤT QUAN TRỌNG: Bảo GitHub mặc định chạy các lệnh trong thư mục backend
    defaults:
      run:
        working-directory: ./backend 

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v3

    - name: Cài đặt Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Cài đặt Dependencies
      run: npm install

    - name: Chạy Test
      run: npm test